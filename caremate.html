<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#60a5fa">
  <title>AI Assistant — Your calm health companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #0f172a;
      --muted: #64748b;
      --teal: #60a5fa;
      --teal-dark: #3b82f6;
      --teal-soft: #eff4ff;
      --blue: #60a5fa;
      --blue-soft: #eaf0ff;
      --line: #e8eef9;
      --card: #ffffff;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --sys: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      font-family: var(--sys);
      color: var(--ink);
      background: #f7faff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, strong { font-family: "Plus Jakarta Sans", "DM Sans", sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; min-width: 320px; }
    button, input { font: inherit; }

    .stage {
      display: grid;
      place-items: center;
      min-height: 100dvh;
      padding: 24px 14px;
      background: var(--bg);
    }

    .app {
      display: flex;
      flex-direction: column;
      width: min(100%, 470px);
      height: min(860px, calc(100dvh - 48px));
      min-height: 480px;
      overflow: hidden;
      border: 1px solid rgba(158, 175, 213, .45);
      border-radius: 26px;
      background: var(--card);
      box-shadow: 0 24px 60px -18px rgba(47, 67, 111, .35);
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .86);
      backdrop-filter: blur(6px);
    }
    .avatar { width: 46px; height: 46px; flex: 0 0 46px; border-radius: 50%; overflow: hidden; }
    .avatar .avatar-img, .mini-avatar .avatar-img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .brand-block { flex: 1; min-width: 0; }
    .brand-block h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status { display: flex; align-items: center; gap: 6px; margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #4cbd9d; box-shadow: 0 0 0 3px #d9e1f3; }
    .ghost {
      display: grid; place-items: center;
      width: 34px; height: 34px;
      border: 1px solid var(--line); border-radius: 10px;
      color: var(--muted); background: #fff;
      font-size: 16px; cursor: pointer;
    }
    .ghost:hover { border-color: #b9c5df; color: var(--teal); }
    .lang-select {
      height: 34px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }
    .lang-select:focus { border-color: #8c9fc9; }

    /* ── Thread ─────────────────────────────────────────────────────── */
    .thread {
      flex: 1 1 auto;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 18px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    .row { display: flex; gap: 8px; align-items: flex-end; }
    .row.user { justify-content: flex-end; }
    .mini-avatar {
      width: 28px; height: 28px; flex: 0 0 28px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 2px 6px rgba(47, 67, 111, .18);
      overflow: hidden;
    }
    .bubble {
      max-width: min(80%, 340px);
      padding: 11px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }
    .bubble > :first-child { margin-top: 0; }
    .bubble > :last-child { margin-bottom: 0; }
    .bubble p { margin: 8px 0; }
    .bubble ul { margin: 8px 0; padding-left: 18px; }
    .bubble li { margin: 3px 0; }
    .bubble.assistant {
      background: #f3f5fa;
      border: 1px solid #dce0ea;
      border-bottom-left-radius: 6px;
      color: var(--ink);
    }
    .bubble.user {
      background:var(--teal-dark);
      border-bottom-right-radius: 6px;
      color: #fff;
    }
    .bubble.sos {
      max-width: 100%;
      background: var(--danger-soft);
      border: 1px solid #f2cfca;
      color: #7c3934;
    }
    .bubble .who { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--teal); }
    .row.user .bubble .who { color: rgba(255,255,255,.85); }
    .bubble.sos .who { color: var(--danger); }

    .assist-link {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 10px; padding: 9px 14px; border-radius: 999px;
      text-decoration: none; font-size: 13.5px; font-weight: 700;
      color: #fff; background: var(--teal);
      box-shadow: 0 6px 16px rgba(15, 48, 118,.28);
    }
    .assist-link::after { content: '\2192'; font-weight: 700; }
    .assist-link:hover { filter: brightness(1.07); }
    .assist-link:active { transform: translateY(1px); }
    .bubble.sos .assist-link { background: var(--danger); box-shadow: 0 6px 16px rgba(220,38,38,.3); }

    .typing { display: inline-flex; align-items: center; gap: 5px; padding: 14px 16px; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #8fa0c6;
      animation: bounce 1.25s infinite ease-in-out both;
    }
    .typing span:nth-child(2) { animation-delay: .18s; }
    .typing span:nth-child(3) { animation-delay: .36s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-5px); opacity: 1; } }

    .row .bubble.in, .typing.in { animation: pop .26s ease-out both; }
    @keyframes pop { from { opacity: 0; transform: translateY(7px) scale(.97); } to { opacity: 1; transform: none; } }

    /* ── Emergency flag ─────────────────────────────────────────────── */
    .sos-flag {
      display: none;
      margin: 0 14px 4px;
      padding: 10px 12px;
      border: 1px solid #f2cfca;
      border-radius: 14px;
      background: var(--danger-soft);
      color: #7c3934;
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.5;
    }
    .sos-flag.show { display: block; animation: pop .26s ease-out both; }

    /* ── Quick replies ──────────────────────────────────────────────── */
    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 14px 12px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chips button {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid #cfd7e8;
      border-radius: 999px;
      color: #3b82f6;
      background: #f4f7fc;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: background .15s ease, transform .1s ease, border-color .15s ease;
    }
    .chips button:hover { background: var(--teal-soft); border-color: #a7b6d6; transform: translateY(-1px); }
    .chips button:active { transform: scale(.97); }
    .chips button.danger { color: #a04a44; background: #fdf3f2; border-color: #f2cfca; }
    .chips button.done { color: var(--teal-dark); background: var(--teal-soft); border-color: #a7b6d6; cursor: default; transform: none; }
    .chips button:disabled { opacity: .85; }

    /* ── Composer ───────────────────────────────────────────────────── */
    .composer-wrap { padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: #fff; }
    .composer { display: flex; gap: 8px; }
    .composer input {
      flex: 1 1 auto;
      min-width: 0;
      height: 46px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: #f7f9fc;
      font-size: 14px;
      outline: none;
    }
    .composer input:focus { border-color: #8c9fc9; background: #fff; box-shadow: 0 0 0 3px rgba(47, 82, 158, .14); }
    .composer input::placeholder { color: #9aa4ba; }
    .mic,
    .send {
      display: grid; place-items: center;
      width: 46px; height: 46px; flex: 0 0 46px;
      border: 0; border-radius: 50%;
      color: #fff;
      background:var(--teal-dark);
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 6px 14px -4px rgba(47, 82, 158, .55);
      transition: transform .1s ease, opacity .15s ease;
    }
    .mic {
      background: #eef4ff;
      color: var(--teal-dark);
      font-size: 16px;
      box-shadow: none;
    }
    .mic svg { width: 20px; height: 20px; display: block; }
    .mic.listening {
      background: #fef2f2;
      color: #dc2626;
      animation: mic-pulse 1.2s infinite;
    }
    @keyframes mic-pulse {
      0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, .35); }
      70% { box-shadow: 0 0 0 6px rgba(220, 38, 38, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }
    .send:hover { transform: translateY(-1px); }
    .send:active { transform: scale(.95); }
    .send:disabled { opacity: .55; cursor: default; transform: none; }
    .fineprint { margin: 9px 6px 0; color: var(--muted); font-size: 11px; line-height: 1.5; text-align: center; }
    .fineprint b { color: var(--teal-dark); }
    .link-btn { padding: 0 2px; margin-left: 2px; border: 0; color:var(--teal-dark); background: none; font-size: 11px; font-weight: 700; text-decoration: underline; cursor: pointer; }

    .name-form { display: flex; gap: 6px; margin-top: 9px; }
    .name-form input {
      flex: 1 1 auto; min-width: 0; height: 38px; padding: 0 12px;
      border: 1px solid var(--line); border-radius: 10px;
      color: var(--ink); background: #fff; font-size: 13px; outline: none;
    }
    .name-form input:focus { border-color: #8c9fc9; box-shadow: 0 0 0 3px rgba(47, 82, 158, .14); }
    .name-form button {
      flex: 0 0 auto; height: 38px; padding: 0 14px;
      border: 0; border-radius: 10px; color: #fff;
      background:var(--teal-dark);
      font-size: 13px; font-weight: 700; cursor: pointer;
    }

    /* ── Mobile: make the app fill the screen ───────────────────────── */
    @media (max-width: 560px) {
      .stage { padding: 0; }
      .app { width: 100%; height: 100dvh; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
      .thread { padding-top: 14px; }
    }
    @media (max-width: 380px) {
      .topbar { gap: 8px; padding: 12px 10px; }
      .lang-select { padding: 0 6px; font-size: 11px; max-width: 88px; }
      .brand-block h1 { font-size: 17px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    /* ── Embedded mode (?embed=1): fill the in-page assistant window ── */
    .caremate-embed body { min-width: 0; background: #f7faff; }
    .caremate-embed .stage { min-height: 0; height: 100dvh; padding: 0; background: transparent; }
    .caremate-embed .app { width: 100%; height: 100dvh; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
  </style>
</head>
<body>
  <script>try { if (new URLSearchParams(location.search).get('embed') === '1') document.documentElement.classList.add('caremate-embed'); } catch (e) {}</script>
  <div class="stage">
    <div class="app" role="region" aria-label="AI Assistant chat">
      <header class="topbar">
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <div class="brand-block">
          <h1>AI Assistant</h1>
          <p class="status"><span class="dot"></span> <span id="status-text">Here for you</span></p>
        </div>
        <select class="lang-select" id="lang" aria-label="Language"></select>
        <button class="ghost" id="ttsToggle" type="button" title="Toggle voice reply" aria-label="Toggle voice reply" aria-pressed="false">🔊</button>
        <button class="ghost" id="reset" type="button" title="Start a new chat" aria-label="Start a new chat">↺</button>
      </header>

      <div class="thread" id="thread" role="log" aria-live="polite"></div>

      <div class="sos-flag" id="sos-flag" role="alert">🚨 If this may be a medical emergency, call <b>112</b> (or <b>108</b> for an ambulance in India) now — do not wait.</div>

      <div class="chips" id="chips" aria-label="Quick replies"></div>

      <div class="composer-wrap">
        <form class="composer" id="form" novalidate>
          <input id="input" type="text" autocomplete="off" placeholder="Type a message…" aria-label="Your message">
          <button class="mic" id="micBtn" type="button" aria-label="Speak" title="Voice input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <rect x="9" y="2" width="6" height="12" rx="3"></rect>
              <path d="M5 11a7 7 0 0 0 14 0"></path>
              <line x1="12" y1="18" x2="12" y2="22"></line>
              <line x1="8" y1="22" x2="16" y2="22"></line>
            </svg>
          </button>
          <button class="send" id="send" type="submit" aria-label="Send message" disabled>➤</button>
        </form>
        <p class="fineprint" id="fineprint">General information only — not medical advice. In an emergency, call <b>112</b> or <b>108</b>.</p>
      </div>
    </div>
  </div>

  <script src="js/caremate-chat.js"></script>
  <script>
    (function () {

      /* ── Avatar: the AI Assistant logo ─────────────────────────────── */

      // site needs no server at all.
      function isLocalHost() {
        return /^(localhost|127\.0\.0\.1|\[::1\]|)$/.test(window.location.hostname)
      }
      var ENDPOINT = window.PULSE_ASSISTANT_ENDPOINT ||
        (isLocalHost() ? 'http://localhost:3001/api/chat'
                       : 'https://verimed-6b92d.web.app/api/chat')
      var MAX_HISTORY = 10
      var REQUEST_TIMEOUT_MS = 45000

      var EMERGENCY_PATTERN = new RegExp([
        'chest pain', 'chest tightness', 'pain in (my )?chest',
        "can'?t breathe", 'cannot breathe', 'difficulty breathing',
        'trouble breathing', 'shortness of breath', 'breathless',
        'unresponsive', 'unconscious', 'passed out',
        'severe bleeding', 'bleeding heavily', 'gushing',

        'overdose', 'suicide', 'kill myself', 'self[- ]?harm', 'want to die',

        kn: 'ಈ ಸಾಧನದಲ್ಲಿ ಧ್ವನಿ ಇನ್‌ಪುಟ್ ಬೆಂಬಲಿತವಾಗಿಲ್ಲ.',
        ml: 'ഈ ഉപകരണത്തിൽ വോയ്സ് ഇൻപുട്ട് പിന്തുണയ്ക്കുന്നില്ല.',
        mr: 'या डिव्हाइसवर व्हॉइस इनपुट समर्थित नाही.',
        bn: 'এই ডিভাইসে ভয়েস ইনপুট সমর্থিত নয়।'
      }
      function voiceUnsupportedMsg() { return VOICE_UNSUPPORTED[langCode()] || VOICE_UNSUPPORTED.en }

      var LANGS = {

          name: 'English',

            { id: 'sos', label: 'Emergency SOS 🚨', danger: true, reply: 'If this is an emergency **right now**, {name}: call **112** (or **108** for an ambulance in India) immediately — don\'t wait. 💛\n\nYou matter, and help is close. Please reach out now.' }

        },

        te: {

          utter.rate = 0.98
          utter.pitch = 1.0
          utter.onend = function () { speaking = false }
          utter.onstart = function () { speaking = true }
          window.speechSynthesis.speak(utter)
        } catch (err) {}
      }

      // Voices load asynchronously on some devices; call once so the list is
      // ready by the time the user chats.
      try {
        if (window.speechSynthesis) {
          window.speechSynthesis.getVoices()
          window.speechSynthesis.onvoiceschanged = function () { window.speechSynthesis.getVoices() }
        }
      } catch (err) {}

      /* ── Helpers ───────────────────────────────────────────────────── */
      function esc(value) {
        return String(value)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
      }

      // Light formatting: bold **text**, italic *text* — applied AFTER escaping.
      function format(text) {
        return esc(text)
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      }

      function bubble(rowClass, who, content, className) {
        var row = document.createElement('div')
        row.className = 'row ' + rowClass

        var wrapper = document.createElement('div')
        wrapper.className = 'bubble ' + className
        wrapper.classList.add('in')

        if (who) {
          var tag = document.createElement('span')
          tag.className = 'who'
          tag.textContent = who
          wrapper.appendChild(tag)
        }

        if (content && content.nodeType) wrapper.appendChild(content)
        else if (content) {
          var html = document.createElement('div')
          html.innerHTML = format(content)
          wrapper.appendChild(html)
        }

        row.appendChild(wrapper)
        thread.appendChild(row)
        thread.scrollTop = thread.scrollHeight
        return row
      }

      function addUser(text) {
        bubble('user', 'You', text, 'user')
      }

      function addAssistant(text, opts) {
        opts = opts || {}
        var row = document.createElement('div')
        row.className = 'row assistant'
        var mini = document.createElement('div')
        mini.className = 'mini-avatar'
        mini.innerHTML = AVATAR_HTML
        row.appendChild(mini)

        var wrapper = document.createElement('div')
        wrapper.className = 'bubble ' + (opts.emergency ? 'sos' : 'assistant')
        wrapper.classList.add('in')
        var tag = document.createElement('span')
        tag.className = 'who'
        tag.textContent = 'AI Assistant'
        wrapper.appendChild(tag)
        var html = document.createElement('div')
        html.innerHTML = format(text)
        wrapper.appendChild(html)
        if (opts.link && opts.link.url) {
          var pageLink = document.createElement('a')
          pageLink.className = 'assist-link'
          pageLink.href = opts.link.url
          pageLink.textContent = opts.link.label || 'Open'
          wrapper.appendChild(pageLink)
        }
        row.appendChild(wrapper)
        thread.appendChild(row)
        thread.scrollTop = thread.scrollHeight
        if (opts.emergency) sosFlag.classList.add('show')
        return row
      }

      function setTyping(on) {
        var existing = thread.querySelector('.typing')
        if (!on) {
          if (existing) existing.remove()
          return
        }
        if (existing) return
        var typing = document.createElement('div')
        typing.className = 'row typing'
        typing.innerHTML = '<div class="bubble assistant typing in"><span></span><span></span><span></span></div>'
        thread.appendChild(typing)
        thread.scrollTop = thread.scrollHeight
      }

      function delay(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms) }) }

      function withTimeout(ms) {
        if (typeof AbortController === 'undefined') return undefined
        var controller = new AbortController()
        setTimeout(function () { controller.abort() }, ms)
        return controller.signal
      }

      /* ── Chip rendering ────────────────────────────────────────────── */
      var medsDone = false

      function renderChips() {
        chipsEl.innerHTML = ''
        getReplies().forEach(function (reply) {
          var button = document.createElement('button')
          button.type = 'button'
          button.dataset.id = reply.id
          if (reply.danger) button.classList.add('danger')
          if (reply.id === 'meds' && medsDone) {
            button.classList.add('done')
            button.disabled = true
          }
          button.textContent = reply.id === 'meds' && medsDone ? t('medsDone') : reply.label
          button.addEventListener('click', function () { onQuick(reply) })
          chipsEl.appendChild(button)
        })
      }

      /* ── Quick-reply flows ─────────────────────────────────────────── */
      async function onQuick(reply) {
        if (busy) return
        busy = true
        addUser(reply.label)

        if (reply.id === 'meds') {
          medsDone = true
          renderChips()
        }

        setTyping(true)
        await delay(reply.id === 'sos' ? 350 : 900)

        var isEmergency = reply.id === 'sos' || EMERGENCY_PATTERN.test(reply.label)
        var replyText = personalize(reply.reply)
        var enReply = LANGS.en.replies.find(function (r) { return r.id === reply.id })
        setTyping(false)
        addAssistant(replyText, { emergency: isEmergency })
        history.push({ role: 'user', content: reply.label })
        history.push({ role: 'assistant', content: replyText })
        speak(replyText, personalize((enReply && enReply.reply) || replyText))
        busy = false
        input.focus()
      }

      /* ── Typed questions ───────────────────────────────────────────── */
      // Answers come from the built-in rule engine (js/caremate-chat.js), so
      // typed chat works on the deployed site, offline (PWA) and in the
      // Android app — no server, no API key, no cost. Setting
      // window.PULSE_ASSISTANT_ENDPOINT switches to a server instead, with the
      // local rules kept as the safety net.
      function localAnswer(text, code) {
        var engine = window.MediCareChat
        if (!engine || typeof engine.respond !== 'function') return null
        try {
          var res = engine.respond(text, code || langCode())
          if (res && typeof res.content === 'string' && res.content.trim()) {
            return { content: res.content.trim(), contentEn: res.contentEn, link: res.link }
          }
        } catch (err) { /* fall through to the network */ }
        return null
      }

      async function askAssistant(text, prior, code) {
        if (!window.PULSE_ASSISTANT_ENDPOINT) {
          var quick = localAnswer(text, code)
          if (quick) return quick
        }
        try {
          var response = await fetch(ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, history: prior }),
            signal: withTimeout(REQUEST_TIMEOUT_MS)
          })
          if (!response.ok) throw new Error('Request failed with status ' + response.status)
          var payload = await response.json()
          var content = payload && typeof payload.content === 'string' ? payload.content.trim() : ''
          if (!content) throw new Error('Empty answer')
          return { content: content, contentEn: content, link: payload.link }
        } catch (error) {
          var fallback = localAnswer(text, code)
          if (fallback) return fallback
          throw error
        }
      }

      async function sendTyped(rawText) {
        var text = (rawText || '').trim()
        if (!text || busy) return
        busy = true
        input.value = ''
        sendBtn.disabled = true

        var isEmergency = EMERGENCY_PATTERN.test(text)
        addUser(text)
        setTyping(true)

        var prior = history.slice(-MAX_HISTORY)
        history.push({ role: 'user', content: text })

        // Reply in the language the user actually typed in (auto-detect);
        // fall back to the picker for Latin / romanised text. Remember it so
        // the mic listens in the same language on the next voice input.
        var detected = detectLang(text)
        if (detected) lastVoiceLang = detected
        var replyLang = detected || langCode()

        try {
          var answer = await askAssistant(text, prior, replyLang)

          var urgent = isEmergency || (answer.link && answer.link.url === 'emergency-contacts.html')
          setTyping(false)
          addAssistant(answer.content, { emergency: urgent, link: answer.link })
          history.push({ role: 'assistant', content: answer.content })
          speak(answer.content, answer.contentEn, replyLang)
        } catch (error) {
          setTyping(false)
          var off = t('offline')
          addAssistant(off, { emergency: false })
          speak(off, LANGS.en.ui.offline)
        } finally {
          busy = false
          sendBtn.disabled = true
          input.focus()
        }
      }

      /* ── Welcome + reset ───────────────────────────────────────────── */
      // Greets the user by name (in the chosen language). On a first visit,
      // asks for the name once (saved in localStorage) so every user is
      // greeted by their own name — never a hardcoded one.
      function showWelcome() {
        var name = storedName()
        if (name) {
          var w = personalize(t('welcome') + '\n\n' + t('welcomeSub'))
          addAssistant(w, { emergency: false })
          speak(w, personalize(LANGS.en.ui.welcome + '\n\n' + LANGS.en.ui.welcomeSub))
        } else {
          askForName()
        }
        updateFineprint()
      }

      function askForName(prefill) {
        var row = document.createElement('div')
        row.className = 'row assistant'
        var mini = document.createElement('div')
        mini.className = 'mini-avatar'
        mini.innerHTML = AVATAR_HTML
        row.appendChild(mini)

        var wrapper = document.createElement('div')
        wrapper.className = 'bubble assistant in'
        var tag = document.createElement('span')
        tag.className = 'who'
        tag.textContent = 'AI Assistant'
        wrapper.appendChild(tag)
        var prompt = document.createElement('p')
        prompt.textContent = t('namePrompt')
        wrapper.appendChild(prompt)

        var nameForm = document.createElement('form')
        nameForm.className = 'name-form'
        var nameInput = document.createElement('input')
        nameInput.type = 'text'
        nameInput.maxLength = 24
        nameInput.placeholder = t('namePlaceholder')
        nameInput.setAttribute('aria-label', t('namePlaceholder'))
        nameInput.value = prefill || ''
        var saveBtn = document.createElement('button')
        saveBtn.type = 'submit'
        saveBtn.textContent = t('save')
        nameForm.appendChild(nameInput)
        nameForm.appendChild(saveBtn)
        wrapper.appendChild(nameForm)
        row.appendChild(wrapper)
        thread.appendChild(row)
        thread.scrollTop = thread.scrollHeight
        nameInput.focus()

        nameForm.addEventListener('submit', function (event) {
          event.preventDefault()
          var name = nameInput.value.trim()
          if (!name) { nameInput.focus(); return }
          try { localStorage.setItem(NAME_KEY, name) } catch (err) {}
          row.remove()
          showWelcome()
        })
      }

      // Keeps the footer disclaimer in the current language and adds a small
      // "Change name" link once a name is stored.
      function updateFineprint() {
        var fp = document.getElementById('fineprint')
        if (!fp) return
        var name = storedName()
        if (name) {
          fp.innerHTML = esc(t('fineprint')) + ' · <button class="link-btn" id="rename-btn" type="button">' + esc(t('changeName')) + '</button>'
          var renameBtn = document.getElementById('rename-btn')
          if (renameBtn) {
            renameBtn.addEventListener('click', function () { askForName(name) })
          }
        } else {
          fp.textContent = t('fineprint')
        }
      }

      // Applies the current language to all static UI (title, status,
      // placeholder, buttons) and re-renders the quick replies + footer.
      function applyUi() {
        var code = langCode()
        var ui = LANGS[code].ui
        document.title = ui.title
        document.documentElement.lang = code
        if (statusText) statusText.textContent = ui.status
        input.placeholder = ui.placeholder
        input.setAttribute('aria-label', ui.placeholder)
        sendBtn.setAttribute('aria-label', ui.sendLabel)
        resetBtn.title = ui.resetTitle
        resetBtn.setAttribute('aria-label', ui.resetTitle)
        langSelect.setAttribute('aria-label', ui.langLabel)
        if (ui.sosBanner) sosFlag.innerHTML = ui.sosBanner
        renderChips()
        updateFineprint()
      }

      function populateLangSelect() {
        langSelect.innerHTML = ''
        Object.keys(LANGS).forEach(function (code) {
          var option = document.createElement('option')
          option.value = code
          option.textContent = LANGS[code].name
          langSelect.appendChild(option)
        })
        langSelect.value = langCode()
      }

      function reset() {
        history = []
        medsDone = false
        stopSpeaking()
        thread.innerHTML = ''
        sosFlag.classList.remove('show')
        applyUi()
        showWelcome()
        input.focus()
      }

      /* ── Wiring ────────────────────────────────────────────────────── */
      form.addEventListener('submit', function (event) {
        event.preventDefault()
        sendTyped(input.value)
      })
      input.addEventListener('input', function () {
        sendBtn.disabled = busy || !input.value.trim()
      })
      resetBtn.addEventListener('click', reset)
      /* ── Voice input (mic) ─────────────────────────────────────────── */
      // Inside the installed Android app the WebView has no SpeechRecognition,
      // so we use the native MediCareSpeech plugin (Android SpeechRecognizer).
      // In a desktop browser we fall back to the Web Speech API.
      function nativeSpeech() {
        var cap = window.Capacitor
        if (!cap || typeof cap.isNativePlatform !== 'function' || !cap.isNativePlatform()) return null
        return (cap.Plugins && cap.Plugins.MediCareSpeech) || null
      }

      var listening = false
      // Language of the last message we auto-detected; the mic prefers it so
      // voice input matches how the user has been chatting.
      var lastVoiceLang = ''

      function setListening(on) {
        listening = on
        if (micBtn) {
          micBtn.classList.toggle('listening', on)
          micBtn.setAttribute('aria-pressed', on ? 'true' : 'false')
        }
      }

      function finishVoice(text) {
        setListening(false)
        var value = (text || '').trim()
        if (value) {
          input.value = value
          sendTyped(value)
        }
      }

      function startWebVoice(SR) {
        recognition = new SR()
        recognition.lang = speechLocale(lastVoiceLang || langCode())
        recognition.interimResults = false
        recognition.maxAlternatives = 1
        setListening(true)
        recognition.onresult = function (e) {
          var txt = e.results && e.results[0] && e.results[0][0] && e.results[0][0].transcript
          recognition = null
          finishVoice(txt)
        }
        recognition.onerror = function () { recognition = null; setListening(false) }
        recognition.onend = function () { recognition = null; setListening(false) }
        try { recognition.start() } catch (err) { recognition = null; setListening(false) }
      }

      function startNativeVoice(plugin) {
        setListening(true)
        plugin.available().then(function (res) {
          if (!res || res.available === false) { setListening(false); alert(voiceUnsupportedMsg()); return null }
          return plugin.start({ lang: speechLocale(lastVoiceLang || langCode()) })
        }).then(function (res) {
          if (res === null) return
          finishVoice(res && res.text)
        }).catch(function () {
          setListening(false)
        })
      }

      if (micBtn) micBtn.addEventListener('click', function () {
        stopSpeaking()
        if (listening) {
          var active = nativeSpeech()
          if (active) { try { active.stop() } catch (err) {} }
          if (recognition) { try { recognition.stop() } catch (err) {} ; recognition = null }
          setListening(false)
          return
        }
        var plugin = nativeSpeech()
        if (plugin) { startNativeVoice(plugin); return }
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition
        if (!SR) { alert(voiceUnsupportedMsg()); return }
        startWebVoice(SR)
      })
      langSelect.addEventListener('change', function () {
        try { localStorage.setItem(LANG_KEY, langSelect.value) } catch (err) {}
        reset()
      })

      /* ── Boot ──────────────────────────────────────────────────────── */
      populateLangSelect()
      applyUi()
      showWelcome()
      input.focus()
    })()
  </script>
</body>
</html>
