<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MediCare — Admin Dashboard</title><link rel="stylesheet" href="css/style.css"><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#176b87">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MediCare">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <script src="js/loading.js"></script>
  <main class="container admin-container">
    <header class="topbar"><div><h2>MediCare Admin</h2><div class="greet" id="adminName">Loading...</div></div><button class="icon-btn" onclick="logout()">Log out</button></header>
    <section class="card overview-card"><strong>Today's overview</strong><div class="stat-grid"><div class="stat-box clickable" onclick="openOverviewDetail('patients')"><div class="num" id="totalPatients">0</div><div class="lbl">Patients</div></div><div class="stat-box clickable" onclick="openOverviewDetail('medicines')"><div class="num" id="totalMeds">0</div><div class="lbl">Medicines</div></div><div class="stat-box clickable" onclick="openOverviewDetail('completed')"><div class="num" id="completedToday">0</div><div class="lbl">Completed</div></div></div><div class="stat-grid stat-grid-secondary"><div class="stat-box clickable" onclick="openOverviewDetail('missed')"><div class="num" id="missedToday">0</div><div class="lbl">Missed</div></div><div class="stat-box clickable" onclick="openOverviewDetail('alerts')"><div class="num" id="alertCount">0</div><div class="lbl">Alerts</div></div><div class="stat-box clickable" onclick="openOverviewDetail('penalties')"><div class="num" id="accountabilityTotal">₹0</div><div class="lbl">Penalties</div></div></div></section>
    <section class="card patients-card"><div class="section-heading"><div><strong>Patients</strong><span id="patientCountLabel">Loading directory…</span></div><input id="patientSearch" type="search" placeholder="Search patient or phone" oninput="filterPatients()"></div><div id="patientList" style="margin-top:10px;"><div class="empty-state">Loading patients...</div></div></section>
    <section class="card archived-patients-card" id="archivedPatientsCard" style="display:none;"><div class="section-heading"><div><strong>Archived patients</strong><span>History is retained; patient activities are disabled.</span></div></div><div id="archivedPatientList"></div></section>
  </main>
  <div class="modal-overlay" id="modalOverlay" style="display:none;"><div class="modal-sheet"><span class="close-x" onclick="closeModal()">×</span><div class="modal-header"><h3 id="modalPatientName">Patient</h3></div><div id="modalBody" class="modal-body"></div></div></div>
  <div class="modal-overlay" id="addMedPopup" style="display:none;z-index:1100;"><div class="modal-sheet"><span class="close-x" onclick="closeAddMedicine()">×</span><h3>Add medicine</h3><select id="addMedPatientSelect" style="display:none;"></select><div id="addMedPatientLabel" style="display:none;font-size:13px;color:var(--muted);margin:-4px 0 8px;"></div><input type="text" id="addMedName" placeholder="Medicine name (e.g. Vitamin D)"><input type="text" id="addMedDosage" placeholder="Dosage (e.g. 1 tablet)"><div class="freq-toggle"><button type="button" class="freq-btn active" id="freqDailyBtn" onclick="setAddMedFrequency('daily')">Daily</button><button type="button" class="freq-btn" id="freqWeeklyBtn" onclick="setAddMedFrequency('weekly')">Weekly</button></div><div id="weeklyDaysWrap" style="display:none;"><div class="day-chip-row" id="dayChipRow"><label class="day-chip"><input type="checkbox" value="Sun"><span>Sun</span></label><label class="day-chip"><input type="checkbox" value="Mon"><span>Mon</span></label><label class="day-chip"><input type="checkbox" value="Tue"><span>Tue</span></label><label class="day-chip"><input type="checkbox" value="Wed"><span>Wed</span></label><label class="day-chip"><input type="checkbox" value="Thu"><span>Thu</span></label><label class="day-chip"><input type="checkbox" value="Fri"><span>Fri</span></label><label class="day-chip"><input type="checkbox" value="Sat"><span>Sat</span></label></div></div><div class="time-row"><select id="addMedHour" aria-label="Hour"></select><select id="addMedMinute" class="time-fixed" aria-label="Minute"></select><select id="addMedPeriod" class="time-fixed" aria-label="AM or PM"><option value="AM">AM</option><option value="PM">PM</option></select></div><div class="error-msg" id="addMedError"></div><button class="primary" onclick="saveAddMedicine()">Save medicine</button></div></div>
  <script src="js/theme.js"></script><script src="js/vendor/firebase-app-compat.js"></script><script src="js/vendor/firebase-auth-compat.js"></script><script src="js/vendor/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/admin.js"></script><script src="js/pwa.js"></script>
</body>
</html>
