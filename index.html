<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCare — Smart Health Reminders</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#176b87">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MediCare">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <button class="drawer-trigger" id="drawerTrigger" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>

  <aside class="drawer" id="appDrawer" aria-label="Main menu" aria-hidden="true">
    <div class="drawer-header">
      <div class="drawer-brand">
        <div class="drawer-logo">M</div>
        <div>
          <strong>MediCare</strong>
          <small>Quick access</small>
        </div>
      </div>
      <button class="drawer-close" id="drawerClose" type="button" aria-label="Close menu">×</button>
    </div>

    <nav class="drawer-nav" aria-label="Main navigation">
      <button class="drawer-item active" type="button" data-role="patient" data-action="dashboard">
        <span>🏠</span>
        <span>Dashboard</span>
      </button>
      <button class="drawer-item" type="button" data-role="patient" data-action="reminders">
        <span>⏰</span>
        <span>Reminders</span>
      </button>
      <button class="drawer-item" type="button" data-role="patient" data-action="alerts">
        <span>🔔</span>
        <span>Alerts</span>
      </button>
      <button class="drawer-item" type="button" data-role="admin" data-action="admin">
        <span>🛡️</span>
        <span>Admin View</span>
      </button>
      <button class="drawer-item" type="button" data-action="signup">
        <span>✨</span>
        <span>Create Account</span>
      </button>
      <button class="drawer-item" type="button" data-action="reset">
        <span>🔐</span>
        <span>Reset Password</span>
      </button>
    </nav>

    <div class="drawer-footer">
      <p>Medication support that keeps every dose on track.</p>
    </div>
  </aside>

  <script src="js/loading.js"></script>
  <main class="auth-wrap">
    <div class="logo" aria-label="MediCare logo"><svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="mcLogoBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs><rect x="0" y="0" width="512" height="512" rx="112" fill="url(#mcLogoBg)"/><g transform="translate(256 256) rotate(-45)"><rect x="-126" y="-62" width="252" height="124" rx="62" fill="#ffffff"/><path d="M0 -62 H64 A62 62 0 0 1 64 62 H0 Z" fill="#5eead4"/><line x1="0" y1="-60" x2="0" y2="60" stroke="#0f766e" stroke-opacity="0.2" stroke-width="6"/></g><g transform="translate(256 256) scale(3.9) translate(-12 -12)"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 20.28 3 22 5.42 22 7.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#f43f5e"/></g></svg></div>
    <div class="brand">MediCare</div>
    <div class="tagline">Medication support that keeps every dose on track.</div>

    <div class="role-toggle" aria-label="Choose account type">
      <button id="roleP" class="active" onclick="setRole('patient')">Patient</button>
      <button id="roleA" onclick="setRole('admin')">Admin</button>
    </div>

    <div id="signupFields" style="display:none;">
      <input type="text" id="name" placeholder="Full name" autocomplete="name">
      <input type="tel" id="phone" placeholder="Mobile number" autocomplete="tel">
    </div>

    <input type="email" id="email" placeholder="Email address" autocomplete="email">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button class="forgot-link" type="button" onclick="openResetPassword()">Forgot password?</button>
    <div class="error-msg" id="errorMsg" aria-live="polite"></div>
    <button class="primary" id="submitBtn" onclick="handleSubmit()">Log in</button>
    <button class="secondary" onclick="toggleMode()" id="toggleModeBtn">New here? Create an account</button>
  </main>

  <div class="modal-overlay" id="resetPasswordModal" style="display:none;">
    <div class="modal-sheet reset-modal" role="dialog" aria-modal="true" aria-labelledby="resetPasswordTitle">
      <button class="close-x reset-close" type="button" onclick="closeResetPassword()" aria-label="Close reset password dialog">×</button>
      <div class="reset-icon" aria-hidden="true">✉</div>
      <h3 id="resetPasswordTitle">Reset your MediCare password</h3>
      <p>Enter your email to receive a secure reset link.</p>
      <input type="email" id="resetEmail" placeholder="Email address" autocomplete="email">
      <div class="error-msg" id="resetError" aria-live="polite"></div>
      <button class="primary" id="resetSubmitBtn" type="button" onclick="sendPasswordReset()">Send MediCare reset link</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const drawer = document.getElementById('appDrawer');
      const trigger = document.getElementById('drawerTrigger');
      const backdrop = document.getElementById('drawerBackdrop');
      const closeBtn = document.getElementById('drawerClose');
      const drawerItems = document.querySelectorAll('.drawer-item');

      function updateDrawerState(isOpen) {
        drawer.classList.toggle('open', isOpen);
        backdrop.hidden = !isOpen;
        trigger.setAttribute('aria-expanded', String(isOpen));
        drawer.setAttribute('aria-hidden', String(!isOpen));
      }

      trigger.addEventListener('click', function () {
        updateDrawerState(!drawer.classList.contains('open'));
      });

      closeBtn.addEventListener('click', function () {
        updateDrawerState(false);
      });

      backdrop.addEventListener('click', function () {
        updateDrawerState(false);
      });

      drawerItems.forEach(function (item) {
        item.addEventListener('click', function () {
          drawerItems.forEach(function (button) {
            button.classList.toggle('active', button === item);
          });

          const role = item.dataset.role;
          const action = item.dataset.action;

          if (role) {
            setRole(role);
          }

          if (action === 'signup') {
            toggleMode();
          }

          if (action === 'reset') {
            openResetPassword();
          }

          updateDrawerState(false);
        });
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          updateDrawerState(false);
        }
      });
    });
  </script>

  <script src="js/theme.js"></script>
  <script src="js/vendor/firebase-app-compat.js"></script>
  <script src="js/vendor/firebase-auth-compat.js"></script>
  <script src="js/vendor/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
